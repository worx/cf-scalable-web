#
# CloudFormation Template: Migrate Host
#
# Purpose: Creates an EPHEMERAL EC2 instance in the project VPC for
#          running MariaDB restore + pgloader (MySQL → PostgreSQL)
#          during migration cycles. Sized for bulk-load work
#          (r7g.xlarge, 4 vCPU, 32 GiB), destroyed after each run.
#
#          Design doc: docs/plans/migrate-host-design-2026-08-05.md
#
# Features:
#   - Lives IN the project VPC (public subnet — see subnet-placement
#     note below) so it gets direct SG-based access to RDS with zero
#     peering. Deploy-host stays in its default-VPC/peering pattern
#     (unchanged); the migrate-host is a completely separate story.
#   - r7g.xlarge (4 vCPU, 32 GiB Graviton 3) — RAM headroom for
#     concurrent MariaDB (8 GiB buffer pool) + pgloader (10 GiB SBCL
#     heap) with 14 GiB slack.
#   - 40 GiB gp3 root, 10000 IOPS / 500 MB/s throughput — attacks the
#     current InnoDB flush bottleneck (deploy-host's 3000-IOPS-baseline
#     root EBS was the real bottleneck during mysql < dump.sql).
#   - No swap. 32 GiB RAM is comfortable for our ceilings; swap would
#     only convert an OOM into thrashing.
#   - SSM Session Manager access only (no SSH inbound).
#   - Full backup/restore parity with deploy-host — dedicated S3
#     bucket, backup-state.sh + restore-state.sh, nightly
#     EventBridge Scheduler, auto-restore on first boot.
#   - IAM instance role provides AdministratorAccess (same as
#     deploy-host; scope-down deferred per design doc §13 Q3).
#
# Subnet placement note (revised 2026-08-06 during Phase 1 impl):
#   The design doc §5.1 originally said "private subnet." Bootstrap
#   requires outbound internet (apt-get, curl for AWS CLI download),
#   which needs either a NAT gateway (project VPC has none, per
#   design) or a public subnet with IGW. Public subnet is the
#   MVP-simplest choice — matches deploy-host's access model
#   (public IP, no ingress SG) and adds no new infrastructure.
#   Alternative (bake AMI) would eliminate this requirement but
#   is Phase 6 per the design doc.
#
# Dependencies:
#   - cf-scalable-web-${EnvironmentName}-vpc  (imports public subnets + RDS SG)
#   - cf-migrate-host-backups                 (imports backups bucket ARN via param)
#
# Lifecycle:
#   - Deployed on-demand at start of migration
#   - Destroyed after migration completes (Phase 4 rollout)
#   - Nightly backup at 02:00 CT if instance is running (silent no-op if not)
#
# Usage:
#   make deploy-migrate-host    ENV=sandbox
#   make ssm-migrate-host       ENV=sandbox
#   make destroy-migrate-host   ENV=sandbox CONFIRMED=yes
#

AWSTemplateFormatVersion: '2010-09-09'
Description: 'Ephemeral migrate host (MariaDB + pgloader) in the project VPC'

Parameters:
  EnvironmentName:
    Type: String
    Description: >-
      Environment name — controls which project VPC / subnets / SGs
      to import. Match this to the target env's cf-vpc stack.
    Default: sandbox
    AllowedValues:
      - sandbox
      - staging
      - production

  InstanceType:
    Type: String
    Description: >-
      EC2 instance type. Default r7g.xlarge (4 vCPU, 32 GiB Graviton 3)
      per design doc §5.1. All allowed values are Graviton 3, xlarge+.
    Default: r7g.xlarge
    AllowedValues:
      - m7g.xlarge      # 4 vCPU, 16 GiB — tight RAM; per §4 not recommended
      - m7g.2xlarge     # 8 vCPU, 32 GiB — extra vCPU under-used
      - r7g.xlarge      # 4 vCPU, 32 GiB — RECOMMENDED
      - r7g.2xlarge     # 4 vCPU, 64 GiB — for 20+ GiB client DBs
      - c7g.xlarge      # 4 vCPU, 8 GiB — too tight, listed for completeness
      - c7g.2xlarge     # 8 vCPU, 16 GiB — CPU-heavy, not our workload

  UbuntuAMI:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Description: Ubuntu 24.04 LTS ARM64 AMI (resolved from SSM)
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/arm64/hvm/ebs-gp3/ami-id

  MigrateHostBackupsBucketName:
    Type: String
    Description: >-
      Bucket name for migrate-host state backups (SSH keys, .env,
      .aws/config, .zsh_history). Must match the MigrateHostBackupsBucketName
      output of the cf-migrate-host-backups stack.
    AllowedPattern: '^[a-z0-9.-]+$'
    Default: 'sandbox-migrate-host-backups-kv-worxco'

  RootVolumeSize:
    Type: Number
    Description: >-
      Root EBS volume size in GiB. Sizing math (design doc §5.2):
      ~5 GiB OS + ~3 GiB staged dump on /var/tmp/migration/ +
      ~6 GiB imported /var/lib/mysql + working temp ~= 15 GiB peak.
      40 GiB gives 25 GiB slack for future bigger client DBs.
    Default: 40
    MinValue: 20
    MaxValue: 500

  RootVolumeIops:
    Type: Number
    Description: >-
      Root EBS provisioned IOPS. gp3 baseline is 3000; we provision
      10000 to attack the InnoDB flush bottleneck during bulk import.
      gp3 max is 16000 (raise if a future workload needs it).
    Default: 10000
    MinValue: 3000
    MaxValue: 16000

  RootVolumeThroughput:
    Type: Number
    Description: >-
      Root EBS throughput in MB/s. gp3 baseline is 125; we provision
      500 for parallel InnoDB flushes + dump sequential reads.
      gp3 max is 1000.
    Default: 500
    MinValue: 125
    MaxValue: 1000

Resources:
  # ========================================
  # Security Group (no inbound, SSM only)
  # ========================================
  # Lives in the project VPC — inbound blocked, outbound open.
  # Outbound needed for: apt (public repos via IGW), AWS APIs (via
  # IGW OR VPC endpoints), Secrets Manager (VPC endpoint), S3 (gateway
  # endpoint), and — critically — RDS 5432 to the RDS SG (allowed by
  # the RDSIngressFromMigrateHost rule below).

  MigrateHostSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${AWS::StackName}-sg'
      GroupDescription: >-
        Migrate-host SG - no inbound (SSM Session Manager only),
        default all-egress. RDS 5432 access authorized by
        RDSIngressFromMigrateHost (below), not by egress rule.
      VpcId: !ImportValue
        Fn::Sub: '${EnvironmentName}-vpc-id'
      # No SecurityGroupIngress — all inbound blocked
      # Default egress allows all outbound
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-sg'

  # ========================================
  # RDS ingress rule (inline for lifecycle atomicity)
  # ========================================
  # Adds an inbound rule on the project's RDS SG allowing 5432 from
  # this migrate-host's SG. Inline (not in a separate peering stack)
  # so destroying this stack removes the rule atomically — no
  # cross-stack SG reference to fail on destroy. See design doc §7.3.

  RDSIngressFromMigrateHost:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !ImportValue
        Fn::Sub: '${EnvironmentName}-rds-sg-id'
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref MigrateHostSecurityGroup
      Description: !Sub 'Postgres from ${AWS::StackName} (pgloader target)'

  # ========================================
  # IAM Role (Admin + SSM)
  # ========================================
  # Same shape as deploy-host — AdministratorAccess is broad but
  # matches what MariaDB + pgloader + backup-state.sh + restore-state.sh
  # transitively need (S3 read/write, Secrets Manager read, SSM,
  # RDS network). Scoping tighter is design doc §13 Q3 (post-MVP).

  MigrateHostRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AdministratorAccess
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-role'

  MigrateHostInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${AWS::StackName}-profile'
      Roles:
        - !Ref MigrateHostRole

  # ========================================
  # EC2 Instance
  # ========================================
  # Placement: project VPC PUBLIC subnet — bootstrap needs outbound
  # internet for apt + AWS CLI download; public subnet + IGW is the
  # MVP-simplest way. SG blocks all inbound so the public-IP
  # attack surface is zero. Alternative (private subnet + pre-baked
  # AMI) is Phase 6 per design doc §12.
  #
  # NOTE: no SSMSessionPreferences resource here — the account-wide
  # SSM-SessionManagerRunShell document is already owned by
  # cf-deploy-host. Two stacks creating same-named document collide.

  MigrateHostInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref UbuntuAMI
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref MigrateHostInstanceProfile
      # NetworkInterfaces (not SubnetId + SecurityGroupIds) so we can
      # explicitly request a public IP. The sandbox public subnets
      # have MapPublicIpOnLaunch=false, so relying on the subnet
      # default would launch without a public IP — outbound apt/curl
      # would fail. AssociatePublicIpAddress: true forces the IP.
      NetworkInterfaces:
        - DeviceIndex: 0
          AssociatePublicIpAddress: true
          SubnetId: !Select
            - 0
            - !Split
              - ','
              - !ImportValue
                  Fn::Sub: '${EnvironmentName}-public-subnets'
          GroupSet:
            - !Ref MigrateHostSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref RootVolumeSize
            VolumeType: gp3
            Iops: !Ref RootVolumeIops
            # NOTE: Throughput is NOT settable on inline EC2 Instance
            # BlockDeviceMappings — AWS exposes it only on standalone
            # AWS::EC2::Volume. Set post-boot via `aws ec2 modify-volume`
            # in the UserData below (see "Bump root EBS throughput"
            # step). gp3 volume-modify is an online operation.
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64:
          Fn::Sub:
            - |
              #!/bin/bash
              # ============================================================
              # Migrate Host UserData — minimal bootstrap
              #
              # Same shape as deploy-host UserData: install just enough to
              # clone the repo, then hand off to scripts/migrate-host/bootstrap.sh
              # for the real work. Auto-restore state from S3 at the end.
              #
              # No swap allocation (32 GiB RAM makes it unnecessary — see
              # design doc §5.3).
              # ============================================================
              set -euo pipefail
              CF_REGION="${Region}"
              export AWS_DEFAULT_REGION=$CF_REGION
              export DEBIAN_FRONTEND=noninteractive
              export HOME=/root

              exec > >(tee /var/log/migrate-host-bootstrap.log) 2>&1
              set -x

              echo "=== UserData starting $(date) ==="
              echo "Region: $CF_REGION"
              echo "Memory: $(free -h | awk '/^Mem:/ {print $3"/"$2}')"
              echo "Disk:   $(df -h / | awk 'NR==2 {print $3"/"$2" ("$5")"}')"

              # Just enough tools to clone the repo
              apt-get update -y
              apt-get install -y git jq unzip python3 curl

              # AWS CLI v2 (ARM64) — needed for Secrets Manager + modify-volume
              cd /tmp
              curl -sS "https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip" -o "awscliv2.zip"
              unzip -q awscliv2.zip
              ./aws/install
              rm -rf aws awscliv2.zip
              cd /

              # Bump root EBS throughput post-boot (CFN's inline
              # BlockDeviceMappings doesn't expose Throughput on
              # AWS::EC2::Instance — it's only settable on standalone
              # AWS::EC2::Volume). gp3 modify-volume is an online
              # operation; no reboot needed.
              INSTANCE_ID=$(curl -s http://169.254.169.254/latest/meta-data/instance-id)
              ROOT_VOLUME=$(aws ec2 describe-instances \
                --instance-ids "$INSTANCE_ID" \
                --query 'Reservations[0].Instances[0].BlockDeviceMappings[0].Ebs.VolumeId' \
                --output text --region "$CF_REGION" 2>/dev/null) || ROOT_VOLUME=""
              if [ -n "$ROOT_VOLUME" ] && [ "$ROOT_VOLUME" != "None" ]; then
                echo "=== Bumping root EBS ($ROOT_VOLUME) throughput to ${Throughput} MB/s ==="
                aws ec2 modify-volume \
                  --volume-id "$ROOT_VOLUME" \
                  --throughput ${Throughput} \
                  --region "$CF_REGION" >/dev/null \
                  || echo "WARN: modify-volume failed - throughput stays at gp3 default (125 MB/s)"
              else
                echo "WARN: could not resolve root volume ID - throughput bump skipped"
              fi

              # GitHub deploy key from Secrets Manager (SHARED with deploy-host)
              # We reuse worxco/deploy-host/github-ssh-key so both hosts clone
              # the same repo with the same key. Migrate-host doesn't need its
              # own secret rotation cycle.
              echo "=== Configuring GitHub SSH access ==="
              mkdir -p /home/ubuntu/.ssh
              chmod 700 /home/ubuntu/.ssh
              SSH_SECRET=$(aws secretsmanager get-secret-value \
                --secret-id "worxco/deploy-host/github-ssh-key" \
                --region $CF_REGION \
                --query 'SecretString' \
                --output text 2>/dev/null) || SSH_SECRET=""
              if [ -n "$SSH_SECRET" ]; then
                echo "$SSH_SECRET" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['private_key'])" > /home/ubuntu/.ssh/github_deploy_key
                echo "$SSH_SECRET" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['public_key'])"  > /home/ubuntu/.ssh/github_deploy_key.pub
                chmod 600 /home/ubuntu/.ssh/github_deploy_key
                chmod 644 /home/ubuntu/.ssh/github_deploy_key.pub
                cat > /home/ubuntu/.ssh/config << 'SSHCFGEOF'
              Host github.com
                IdentityFile ~/.ssh/github_deploy_key
                StrictHostKeyChecking accept-new
              SSHCFGEOF
                chmod 600 /home/ubuntu/.ssh/config
                chown -R ubuntu:ubuntu /home/ubuntu/.ssh
                unset SSH_SECRET
              else
                echo "WARN: worxco/deploy-host/github-ssh-key not found - bootstrap will fail at clone step"
              fi

              # Clone the repo
              mkdir -p /home/ubuntu/projects
              chown ubuntu:ubuntu /home/ubuntu/projects
              if [ -f /home/ubuntu/.ssh/github_deploy_key ]; then
                echo "=== Cloning repository ==="
                su - ubuntu -c 'cd ~/projects && git clone git@github.com:worx/cf-scalable-web.git'
              fi

              # Hand off to the bootstrap script in the repo (the heavy lifting)
              REPO_DIR=/home/ubuntu/projects/cf-scalable-web
              if [ -x "$REPO_DIR/scripts/migrate-host/bootstrap.sh" ]; then
                echo "=== Running scripts/migrate-host/bootstrap.sh ==="
                bash "$REPO_DIR/scripts/migrate-host/bootstrap.sh"
              else
                echo "ERROR: $REPO_DIR/scripts/migrate-host/bootstrap.sh not found or not executable"
                echo "Check repo clone above. Bootstrap cannot continue."
                exit 1
              fi

              # ============================================================
              # Auto-restore operator state from sandbox S3 (if available)
              # ============================================================
              # After bootstrap completes, attempt to restore prior state
              # backup: SSH keys, .env files, .aws/config, custom bin/
              # directories for both root and ubuntu.
              #
              # If no backup exists in S3 (fresh migrate-host or first ever
              # deploy), this block quietly no-ops.
              #
              # Real .aws/credentials are NOT in the backup. restore-state.sh
              # writes stub files explaining this if credentials are absent
              # post-restore.
              BACKUPS_BUCKET="${BackupsBucket}"
              LATEST_KEY="config/migrate-host-latest.tar.gz"

              if aws s3api head-object \
                   --bucket "$BACKUPS_BUCKET" --key "$LATEST_KEY" >/dev/null 2>&1; then
                echo "=== Prior migrate-host state found in S3 - attempting restore ==="
                mkdir -p /opt/migrate-host/scripts/migrate-host
                RESTORE_READY=1
                aws s3 cp "s3://$BACKUPS_BUCKET/scripts/_common.sh" \
                          /opt/migrate-host/scripts/_common.sh \
                  || { echo "WARN: could not fetch scripts/_common.sh from S3 - skipping restore"; RESTORE_READY=0; }
                if [ "$RESTORE_READY" = "1" ]; then
                  aws s3 cp "s3://$BACKUPS_BUCKET/scripts/migrate-host/restore-state.sh" \
                            /opt/migrate-host/scripts/migrate-host/restore-state.sh \
                    || { echo "WARN: could not fetch scripts/migrate-host/restore-state.sh from S3 - skipping restore"; RESTORE_READY=0; }
                fi
                if [ "$RESTORE_READY" = "1" ]; then
                  chmod +x /opt/migrate-host/scripts/migrate-host/restore-state.sh
                  # CONFIRMED=yes — UserData is non-interactive
                  CONFIRMED=yes MIGRATE_HOST_BACKUPS_BUCKET="$BACKUPS_BUCKET" \
                    /opt/migrate-host/scripts/migrate-host/restore-state.sh \
                    || echo "WARN: restore-state.sh exited non-zero - partial or no restore"
                fi
              else
                echo "=== No prior migrate-host state in S3 - fresh instance ==="
              fi

              echo "=== UserData complete $(date) ==="
            - Region: !Ref 'AWS::Region'
              BackupsBucket: !Ref MigrateHostBackupsBucketName
              Throughput: !Ref RootVolumeThroughput

      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}'
        - Key: Purpose
          Value: Ephemeral migration host (MariaDB + pgloader)
        - Key: Environment
          Value: !Ref EnvironmentName

  # ========================================
  # EventBridge Scheduler — nightly state backup
  # ========================================
  # Fires at 02:00 America/Chicago every day (DST-aware).
  # SSM SendCommand target fails silently if the instance is not
  # running (which is the common case under ephemeral lifecycle) —
  # harmless no-op. On days when the instance IS up ("keep" mode),
  # the backup captures state normally.
  #
  # Prerequisites for the scheduled backup to succeed:
  #   1. cf-migrate-host-backups stack deployed (creates bucket)
  #   2. scripts/_common.sh + scripts/migrate-host/backup-state.sh
  #      exist in the bucket (uploaded automatically on first
  #      `make backup-migrate-host` call)

  MigrateHostSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-scheduler-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SendCommandToMigrateHost
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${MigrateHostInstance}'
                  - !Sub 'arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-scheduler-role'
        - Key: Purpose
          Value: Migrate-host nightly backup scheduler

  MigrateHostNightlyBackupSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub '${AWS::StackName}-nightly-backup'
      Description: >-
        Nightly backup of migrate-host operator-managed state to
        sandbox S3. Fires at 02:00 America/Chicago (DST-aware).
        No-op if instance is not running (ephemeral lifecycle default).
      ScheduleExpression: cron(0 2 * * ? *)
      ScheduleExpressionTimezone: America/Chicago
      FlexibleTimeWindow:
        Mode: 'OFF'
      State: ENABLED
      Target:
        Arn: 'arn:aws:scheduler:::aws-sdk:ssm:sendCommand'
        RoleArn: !GetAtt MigrateHostSchedulerRole.Arn
        Input: !Sub |
          {
            "DocumentName": "AWS-RunShellScript",
            "InstanceIds": ["${MigrateHostInstance}"],
            "TimeoutSeconds": 600,
            "Parameters": {
              "commands": [
                "set -eu",
                "mkdir -p /opt/migrate-host/scripts/migrate-host",
                "aws s3 cp \"s3://${MigrateHostBackupsBucketName}/scripts/_common.sh\" /opt/migrate-host/scripts/_common.sh --quiet",
                "aws s3 cp \"s3://${MigrateHostBackupsBucketName}/scripts/migrate-host/backup-state.sh\" /opt/migrate-host/scripts/migrate-host/backup-state.sh --quiet",
                "chmod +x /opt/migrate-host/scripts/migrate-host/backup-state.sh",
                "MIGRATE_HOST_BACKUPS_BUCKET=${MigrateHostBackupsBucketName} /opt/migrate-host/scripts/migrate-host/backup-state.sh"
              ]
            }
          }

Outputs:
  MigrateHostInstanceId:
    Description: Migrate host EC2 instance ID
    Value: !Ref MigrateHostInstance
    Export:
      Name: !Sub '${AWS::StackName}-instance-id'

  MigrateHostPublicIP:
    Description: Public IP (for outbound internet only — no inbound ports open)
    Value: !GetAtt MigrateHostInstance.PublicIp

  MigrateHostPrivateIP:
    Description: Private IP (VPC-internal — used by RDS SG rules)
    Value: !GetAtt MigrateHostInstance.PrivateIp

  SSMCommand:
    Description: SSM Session Manager command (primary access method)
    Value: !Sub 'aws ssm start-session --target ${MigrateHostInstance}'

  SecurityGroupId:
    Description: Migrate-host security group ID
    Value: !GetAtt MigrateHostSecurityGroup.GroupId
    Export:
      Name: !Sub '${AWS::StackName}-sg-id'

  NightlyBackupScheduleName:
    Description: EventBridge Scheduler name (fires nightly 02:00 America/Chicago)
    Value: !Ref MigrateHostNightlyBackupSchedule

